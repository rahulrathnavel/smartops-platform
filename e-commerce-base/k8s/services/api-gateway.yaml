apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ammazone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 295284356306.dkr.ecr.ap-south-1.amazonaws.com/ammazone/api-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ammazone-config
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "150m" }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ammazone
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000

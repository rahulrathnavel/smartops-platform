# Public LoadBalancer for e-commerce frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
  namespace: ammazone
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http

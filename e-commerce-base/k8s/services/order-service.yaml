apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ammazone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3005"
        prometheus.io/path: "/metrics"
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 683444362809.dkr.ecr.ap-south-1.amazonaws.com/ammazone/order-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: ammazone-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ammazone-secrets
                  key: COSMOS_ORDERS_URI
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "150m" }
          readinessProbe:
            httpGet: { path: /health, port: 3005 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ammazone
spec:
  selector:
    app: order-service
  ports:
    - port: 3005
      targetPort: 3005

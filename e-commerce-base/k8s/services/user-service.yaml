apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ammazone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 683444362809.dkr.ecr.ap-south-1.amazonaws.com/ammazone/user-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: ammazone-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: ammazone-secrets
                  key: COSMOS_USERS_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ammazone-secrets
                  key: JWT_SECRET
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "150m" }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ammazone
spec:
  selector:
    app: user-service
  ports:
    - port: 3001
      targetPort: 3001

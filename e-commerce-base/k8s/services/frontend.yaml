apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ammazone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 683444362809.dkr.ecr.ap-south-1.amazonaws.com/ammazone/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "150m" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ammazone
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

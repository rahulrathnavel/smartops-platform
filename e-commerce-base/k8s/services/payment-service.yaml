apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ammazone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3004"
        prometheus.io/path: "/metrics"
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: 683444362809.dkr.ecr.ap-south-1.amazonaws.com/ammazone/payment-service:latest
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: ammazone-config
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits:   { memory: "128Mi", cpu: "150m" }
          readinessProbe:
            httpGet: { path: /health, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ammazone
spec:
  selector:
    app: payment-service
  ports:
    - port: 3004
      targetPort: 3004

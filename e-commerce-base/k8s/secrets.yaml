# Secrets - sensitive values
# PLACEHOLDER values must be base64 encoded and replaced by deploy script
apiVersion: v1
kind: Secret
metadata:
  name: ammazone-secrets
  namespace: ammazone
type: Opaque
stringData:
  JWT_SECRET: "PLACEHOLDER_JWT_SECRET"
  COSMOS_USERS_URI: "PLACEHOLDER_COSMOS_CONNECTION_STRING"
  COSMOS_CATALOG_URI: "PLACEHOLDER_COSMOS_CONNECTION_STRING"
  COSMOS_ORDERS_URI: "PLACEHOLDER_COSMOS_CONNECTION_STRING"
  APPINSIGHTS_CONNECTION_STRING: "PLACEHOLDER_APPINSIGHTS_CONNECTION_STRING"
